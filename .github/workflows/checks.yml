name: Python and publication checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_publication.py --staged

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ETF_GENOME_RUN_LIVE_SEC_TESTS: '0'
      ETF_GENOME_RUN_LIVE_MARKET_TESTS: '0'
      ETF_GENOME_OFFLINE_MODE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      # mypy covers the optional tracking and tuning modules too.
      - run: python -m pip install -e ".[desktop,dev,ml,research,training]"
      - run: python -m ruff check src tests apps scripts
      - run: python -m ruff format --check src tests apps scripts
      - run: python -m mypy
      - run: python -m pytest
