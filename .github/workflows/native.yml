name: Native C++ checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Linux compiler
        if: runner.os == 'Linux'
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DETF_GENOME_WARNINGS_AS_ERRORS=ON
      - name: Configure MSVC
        if: runner.os == 'Windows'
        run: cmake -S native -B build/native -DETF_GENOME_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build/native --config Release --parallel 2
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Python / C++ parity (Linux)
        if: runner.os == 'Linux'
        env:
          ETF_GENOME_NATIVE_BINARY: ./build/native/etf-genome-native
        run: python -m pytest tests/integration/test_native_parity.py
      - name: Python / C++ parity (Windows)
        if: runner.os == 'Windows'
        env:
          ETF_GENOME_NATIVE_BINARY: ./build/native/Release/etf-genome-native.exe
        run: python -m pytest tests/integration/test_native_parity.py

  memory-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S native -B build/sanitize -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DETF_GENOME_ENABLE_SANITIZERS=ON -DETF_GENOME_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build/sanitize --parallel 2
      - run: ctest --test-dir build/sanitize --output-on-failure

  thread-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S native -B build/tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DETF_GENOME_ENABLE_TSAN=ON -DETF_GENOME_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build/tsan --parallel 2
      - run: ctest --test-dir build/tsan --output-on-failure
